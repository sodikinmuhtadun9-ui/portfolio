<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Dev & SaaS - Sodikin Muhtadun</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #050505;
            color: #e2e8f0;
            background-image: linear-gradient(to right, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.6) 100%), 
                              url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        @media (max-width: 768px) {
            body { background-attachment: scroll; }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="antialiased selection:bg-white/30 selection:text-white">

    <nav class="sticky top-0 z-50 glass-panel border-b border-white/10 px-6 md:px-16 py-4 flex justify-between items-center shadow-lg">
        <a href="index.html" class="text-xl font-bold tracking-tight text-white uppercase tracking-widest hover:opacity-80 transition">SODIKIN MUHTADUN</a>
        <div class="hidden md:flex gap-8 text-sm font-medium text-gray-400">
            <a href="index.html" class="hover:text-white transition flex items-center gap-2">&larr; Kembali ke Beranda</a>
        </div>
        <a href="index.html#contact" class="px-5 py-2.5 bg-white hover:bg-gray-200 text-black text-sm font-bold rounded-md shadow-md transition uppercase tracking-wider">
            Hubungi Saya
        </a>
    </nav>

    <header class="bg-black/40 py-16 px-6 md:px-16 border-b border-white/5 text-center backdrop-blur-sm">
        <div class="max-w-3xl mx-auto">
            <div class="w-16 h-16 glass-panel text-white rounded-xl flex items-center justify-center text-3xl font-bold mx-auto mb-6 shadow-inner border border-white/15">
                💻
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold text-white mb-4 tracking-tight">Web Development & SaaS</h1>
            <p class="text-gray-400 text-base md:text-lg font-light leading-relaxed">
                Proyek pengembangan aplikasi web, integrasi API, dan pemanfaatan AI yang saya bangun secara mandiri.
            </p>
        </div>
    </header>


    <section class="py-16 px-6 md:px-16 max-w-7xl mx-auto flex-grow w-full">
        <div id="portfolio-container" class="grid md:grid-cols-2 gap-10">
            <div class="col-span-full text-center py-10">
                <p class="text-gray-400 animate-pulse font-light">Memuat data portofolio dari database...</p>
            </div>
        </div>
    </section>


    <footer class="bg-black/60 border-t border-white/10 text-gray-500 py-6 text-center text-sm font-light mt-auto">
        <p>&copy; 2026 Sodikin Muhtadun. Built with Tailwind CSS & Firebase.</p>
    </footer>


    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB8F08ve5inAL_VSImpH7va2IDsP8fkKds",
            authDomain: "portfolio-sodikin.firebaseapp.com",
            projectId: "portfolio-sodikin",
            storageBucket: "portfolio-sodikin.firebasestorage.app",
            messagingSenderId: "682078957091",
            appId: "1:682078957091:web:f27fe8b95fe2cf238f4b96"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadWebProjects() {
            const container = document.getElementById('portfolio-container');
            try {
                const q = query(collection(db, "projects"), where("category", "==", "web-dev"));
                const querySnapshot = await getDocs(q);
                
                container.innerHTML = ''; 

                if(querySnapshot.empty) {
                    container.innerHTML = '<div class="col-span-full text-center py-10 text-gray-500 font-light">Belum ada portofolio di kategori ini. Tambahkan via Admin.</div>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const cardHTML = `
                        <div class="glass-panel rounded-xl overflow-hidden border border-white/10 hover:border-white/30 transition duration-300 flex flex-col group">
                            <div class="h-64 bg-white/5 border-b border-white/10 relative overflow-hidden">
                                <img src="${data.imageUrl}" alt="${data.title}" class="w-full h-full object-cover object-top opacity-80 group-hover:opacity-100 group-hover:scale-105 transition duration-500">
                            </div>
                            <div class="p-8 flex flex-col flex-grow">
                                <div class="flex justify-between items-start mb-4">
                                    <h3 class="text-2xl font-bold text-white tracking-tight">${data.title}</h3>
                                </div>
                                <p class="text-gray-400 mb-8 text-sm leading-relaxed flex-grow font-light">
                                    ${data.description}
                                </p>
                                <div class="flex gap-4 mt-auto">
                                    <a href="${data.link}" target="_blank" class="flex-1 py-3 bg-white hover:bg-gray-200 text-black text-center text-xs font-bold uppercase tracking-wider rounded-md transition">Kunjungi Tautan &rarr;</a>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += cardHTML;
                });
            } catch (error) {
                console.error("Error mengambil data:", error);
                container.innerHTML = '<div class="col-span-full text-center py-10 text-red-400 font-light">Gagal memuat data dari database.</div>';
            }
        }

        loadWebProjects();
    </script>
</body>
</html>
