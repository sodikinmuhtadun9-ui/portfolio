<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Operations & Admin - Sodikin Muhtadun</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">

    <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200 px-6 md:px-16 py-4 flex justify-between items-center shadow-sm">
        <a href="index.html" class="text-xl font-bold tracking-tight text-slate-900 hover:text-emerald-600 transition">SODIKIN MUHTADUN</a>
        <div class="hidden md:flex gap-8 text-sm font-medium text-slate-600">
            <a href="index.html" class="hover:text-emerald-600 transition">&larr; Kembali ke Beranda</a>
        </div>
        <a href="index.html#contact" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-xl shadow-md transition">
            Hubungi Saya
        </a>
    </nav>

    <header class="bg-white py-16 px-6 md:px-16 border-b border-slate-200 text-center">
        <div class="max-w-3xl mx-auto">
            <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center text-3xl font-bold mx-auto mb-6">
                📊
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900 mb-4">Data Operations & Admin</h1>
            <p class="text-slate-600 text-lg">
                Rekam jejak pengelolaan stok, otomasi laporan, dan pembersihan data menggunakan Advanced Excel.
            </p>
        </div>
    </header>

    <section class="py-16 px-6 md:px-16 max-w-7xl mx-auto">
        <div id="portfolio-container" class="grid md:grid-cols-2 gap-10">
            <div class="col-span-full text-center py-10">
                <p class="text-slate-500 animate-pulse">Memuat data portofolio dari database...</p>
            </div>
        </div>
    </section>

    <footer class="bg-slate-900 text-slate-400 py-6 text-center text-sm">
        <p>&copy; 2026 Sodikin Muhtadun. Pengalaman Nyata & Solusi Digital.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB8F08ve5inAL_VSImpH7va2IDsP8fkKds",
            authDomain: "portfolio-sodikin.firebaseapp.com",
            projectId: "portfolio-sodikin",
            storageBucket: "portfolio-sodikin.firebasestorage.app",
            messagingSenderId: "682078957091",
            appId: "1:682078957091:web:f27fe8b95fe2cf238f4b96"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadDataOpsProjects() {
            const container = document.getElementById('portfolio-container');
            try {
                // Di sini perbedaannya: Kita hanya ambil kategori 'data-ops'
                const q = query(collection(db, "projects"), where("category", "==", "data-ops"));
                const querySnapshot = await getDocs(q);
                
                container.innerHTML = ''; 

                if(querySnapshot.empty) {
                    container.innerHTML = '<div class="col-span-full text-center py-10 text-slate-500">Belum ada portofolio di kategori ini. Tambahkan via Admin.</div>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const cardHTML = `
                        <div class="bg-white rounded-3xl overflow-hidden shadow-xl border border-slate-200 hover:border-emerald-500 transition duration-300 flex flex-col">
                            <div class="h-64 bg-slate-100 border-b border-slate-200 relative">
                                <img src="${data.imageUrl}" alt="${data.title}" class="w-full h-full object-cover object-top">
                            </div>
                            <div class="p-8 flex flex-col flex-grow">
                                <div class="flex justify-between items-start mb-4">
                                    <h3 class="text-2xl font-bold text-slate-900">${data.title}</h3>
                                </div>
                                <p class="text-slate-600 mb-8 text-sm leading-relaxed flex-grow">
                                    ${data.description}
                                </p>
                                <div class="flex gap-4 mt-auto">
                                    <a href="${data.link}" target="_blank" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-center text-sm font-semibold rounded-xl transition">Kunjungi Tautan</a>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += cardHTML;
                });
            } catch (error) {
                console.error("Error mengambil data:", error);
                container.innerHTML = '<div class="col-span-full text-center py-10 text-red-500">Gagal memuat data dari database.</div>';
            }
        }

        loadDataOpsProjects();
    </script>
</body>
</html>
