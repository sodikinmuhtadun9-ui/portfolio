<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manajemen Portofolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 p-6 md:p-12">
    
    <div class="max-w-2xl mx-auto bg-white p-8 md:p-10 rounded-3xl shadow-xl border border-slate-200">
        
        <!-- TAMPILAN SEBELUM LOGIN -->
        <div id="login-section" class="text-center py-12">
            <h2 class="text-3xl font-bold text-slate-900 mb-4">Admin Restricted Area</h2>
            <p class="text-slate-600 mb-8">Silakan login menggunakan akun Google yang berhak untuk mengelola portofolio.</p>
            <button id="login-btn" class="px-6 py-3.5 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold rounded-xl shadow-sm transition flex items-center justify-center gap-3 mx-auto">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.15 21.32 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.18C.43 8.12 0 9.8 0 12s.43 3.88 1.18 5.4l4.09-3.16z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.15 2.68 1.18 6.6l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
                Login dengan Google
            </button>
        </div>

        <!-- TAMPILAN SETELAH LOGIN (DISEMBUNYIKAN AWALNYA) -->
        <div id="admin-content" class="hidden">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h2 class="text-2xl md:text-3xl font-bold text-slate-900">Manajemen Portofolio</h2>
                    <p id="user-email" class="text-xs text-slate-500 mt-1"></p>
                </div>
                <div class="flex items-center gap-4">
                    <a href="index.html" class="text-sm text-indigo-600 hover:underline">&larr; Web</a>
                    <button id="logout-btn" class="text-sm text-red-600 hover:underline font-semibold">Keluar</button>
                </div>
            </div>
            
            <form id="portfolio-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Judul Proyek</label>
                    <input type="text" id="title" required class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Kategori Halaman</label>
                    <select id="category" required class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none transition bg-white">
                        <option value="web-dev">Web Dev & SaaS (web-dev.html)</option>
                        <option value="data-ops">Data Operations & Admin (data-ops.html)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Deskripsi Singkat</label>
                    <textarea id="description" rows="3" required class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none transition"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Link Proyek (Live Demo / GitHub)</label>
                    <input type="url" id="link" placeholder="https://..." class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Foto / Gambar</label>
                    <input type="file" id="image" accept="image/*" required class="w-full px-4 py-2 border border-slate-300 rounded-xl file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100 transition">
                </div>

                <button type="submit" id="submit-btn" class="w-full py-4 mt-4 bg-indigo-600 hover:bg-indigo-700 text-white text-lg font-bold rounded-xl shadow-md transition disabled:opacity-70">
                    Simpan Portofolio Baru
                </button>
            </form>

            <hr class="my-10 border-slate-200">

            <h3 class="text-xl font-bold text-slate-900 mb-6">Daftar Portofolio Tersimpan</h3>
            <div id="project-list" class="space-y-4"></div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB8F08ve5inAL_VSImpH7va2IDsP8fkKds",
            authDomain: "portfolio-sodikin.firebaseapp.com",
            projectId: "portfolio-sodikin",
            storageBucket: "portfolio-sodikin.firebasestorage.app",
            messagingSenderId: "682078957091",
            appId: "1:682078957091:web:f27fe8b95fe2cf238f4b96"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const cloudinaryUrl = "https://api.cloudinary.com/v1_1/vskzwxci/image/upload";
        const uploadPreset = "portfolio_upload";

        // Tombol Login Google
        document.getElementById('login-btn').addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                alert("Gagal Login: " + error.message);
            }
        });

        // Tombol Logout
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await signOut(auth);
        });

        // Pantau Status Login Pengguna
        onAuthStateChanged(auth, (user) => {
            const loginSection = document.getElementById('login-section');
            const adminContent = document.getElementById('admin-content');
            
            if (user) {
                // Jika sudah login
                loginSection.classList.add('hidden');
                adminContent.classList.remove('hidden');
                document.getElementById('user-email').textContent = `Login sebagai: ${user.email}`;
                loadProjects();
            } else {
                // Jika belum login
                loginSection.classList.remove('hidden');
                adminContent.classList.add('hidden');
            }
        });

        async function loadProjects() {
            const listContainer = document.getElementById('project-list');
            listContainer.innerHTML = '<p class="text-slate-500 text-sm">Memuat data...</p>';
            
            try {
                const querySnapshot = await getDocs(collection(db, "projects"));
                listContainer.innerHTML = '';
                
                if(querySnapshot.empty) {
                    listContainer.innerHTML = '<p class="text-slate-500 text-sm">Belum ada data portofolio.</p>';
                    return;
                }

                querySnapshot.forEach((documentSnapshot) => {
                    const data = documentSnapshot.data();
                    const id = documentSnapshot.id;
                    listContainer.innerHTML += `
                        <div class="flex items-center justify-between p-4 bg-slate-50 border border-slate-200 rounded-xl">
                            <div>
                                <h4 class="font-bold text-slate-800">${data.title}</h4>
                                <span class="text-xs font-semibold text-indigo-600 uppercase">${data.category}</span>
                            </div>
                            <button onclick="deleteProject('${id}')" class="px-4 py-2 bg-red-100 hover:bg-red-200 text-red-600 text-sm font-semibold rounded-lg transition">Hapus</button>
                        </div>
                    `;
                });
            } catch (error) {
                console.error(error);
                listContainer.innerHTML = '<p class="text-red-500 text-sm">Gagal memuat data.</p>';
            }
        }

        window.deleteProject = async (id) => {
            if(confirm("Yakin ingin menghapus portofolio ini?")) {
                try {
                    await deleteDoc(doc(db, "projects", id));
                    alert("Portofolio berhasil dihapus!");
                    loadProjects(); 
                } catch (error) {
                    alert("Gagal menghapus: " + error.message);
                }
            }
        };

        document.getElementById('portfolio-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = "Mengunggah Gambar...";

            const file = document.getElementById('image').files[0];
            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", uploadPreset);

            try {
                const imgRes = await fetch(cloudinaryUrl, { method: "POST", body: formData });
                const imgData = await imgRes.json();
                
                if (!imgData.secure_url) throw new Error("Upload gambar gagal.");
                
                const imageUrl = imgData.secure_url;
                submitBtn.textContent = "Menyimpan Data...";

                await addDoc(collection(db, "projects"), {
                    title: document.getElementById('title').value,
                    category: document.getElementById('category').value,
                    description: document.getElementById('description').value,
                    link: document.getElementById('link').value,
                    imageUrl: imageUrl,
                    createdAt: serverTimestamp()
                });

                alert("Berhasil! Portofolio ditambahkan.");
                document.getElementById('portfolio-form').reset();
                loadProjects(); 
            } catch (error) {
                console.error("Error:", error);
                alert("Terjadi kesalahan: " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Simpan Portofolio Baru";
            }
        });
    </script>
</body>
</html>
